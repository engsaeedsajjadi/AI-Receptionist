name: Enterprise validation
on:
  pull_request:
  push:
    branches: [main, 'enterprise/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enterprise-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai_test
          POSTGRES_PASSWORD: test-only-ci
          POSTGRES_DB: ai_receptionist_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ai_test -d ai_receptionist_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ai_test:test-only-ci@127.0.0.1:5432/ai_receptionist_test
      TEST_DATABASE_URL: postgresql://ai_test:test-only-ci@127.0.0.1:5432/ai_receptionist_test
      REDIS_URL: redis://127.0.0.1:6379
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
      REQUIRE_INTEGRATION_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run test:coverage -- --reporter=default --reporter=json --outputFile=test-results/vitest.json
      - if: always()
        run: node scripts/ci/check-test-results.mjs test-results/vitest.json
      - if: always()
        run: npm run build
      - if: always()
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            test-results/
            coverage/
          retention-days: 14
