name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  NODE_VERSION: "22"

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate migrations from a clean database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
        run: npm run db:migrate

      - name: Test (unit + integration + AI eval)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
          REDIS_URL: redis://localhost:6379
        run: npm test

      - name: Build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker build
        run: docker build -t ai-receptionist:ci .

      - name: Compose config validation
        run: |
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q
