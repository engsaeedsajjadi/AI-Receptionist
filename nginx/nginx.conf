# AI-Receptionist — nginx reverse proxy (production)
# TLS: mount certificates at ./nginx/certs (fullchain.pem + privkey.pem) and
# uncomment the 443 server block below.

upstream app {
    server app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static:10m max_size=100m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 30m;
    client_body_timeout 60s;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # Health checks (also used by load balancers)
    location = /api/health/live {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Comma-separated chain; the app uses the leftmost entry for rate limiting.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # n8n is intentionally NOT exposed publicly. Access it via SSH tunnel:
    #   ssh -L 5678:localhost:5678 <prod-host>
}

