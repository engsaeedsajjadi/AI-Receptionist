# AI-Receptionist — nginx reverse proxy (production)
# Mounted directly at /etc/nginx/nginx.conf (see docker-compose.prod.yml),
# so this file MUST be a complete config: events + http blocks included.
# TLS: mount certificates at ./nginx/certs (fullchain.pem + privkey.pem) and
# uncomment the 443 server block below.
#
# NOTE (Phase 3 §45): WebSocket proxying for /media verified by config
# review (Upgrade/Connection headers, 1d timeouts, buffering off). The
# sandbox has no nginx/docker runtime, so boot-verify in staging with:
#   docker compose -f docker-compose.prod.yml config
#   docker run --rm -v ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro nginx:1.27-alpine nginx -t

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65s;

    upstream app {
        server app:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream media {
        server media:3001 max_fails=3 fail_timeout=10s;
    }

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static:10m max_size=100m inactive=60m use_temp_path=off;

    server {
        listen 80;
        server_name _;

        client_max_body_size 30m;
        client_body_timeout 60s;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript;
        gzip_min_length 1024;

        # Health checks (also used by load balancers)
        location = /api/health/live {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # Voice media sidecar: telephony gateways open a WebSocket here
        # (VOICE_MEDIA_PUBLIC_URL=wss://<host>/media). The URI is passed through
        # unchanged — the sidecar only upgrades paths starting with /media.
        # Long timeouts: calls stay connected for many minutes. Buffering off:
        # audio/control frames must stream, never batch.
        # Flood control lives in the sidecar (VOICE_MAX_CONCURRENT_SESSIONS +
        # media token + origin allowlist), NOT in per-IP nginx limits — a
        # trunking gateway legitimately opens many calls from one IP.
        location /media {
            proxy_pass http://media;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Comma-separated chain; the app uses the leftmost entry for rate limiting.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # n8n is intentionally NOT exposed publicly. Access it via SSH tunnel:
        #   ssh -L 5678:localhost:5678 <prod-host>
    }

    # server {
    #     listen 443 ssl;
    #     server_name receptionist.example.com;
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
