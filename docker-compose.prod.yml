# AI-Receptionist — production stack (app + postgres + redis + n8n + nginx)
# Secrets MUST come from the environment (or Docker secrets), never from files in Git.
# Required: DATABASE_URL or POSTGRES_PASSWORD, REDIS_URL, JWT_SECRET, JWT_REFRESH_SECRET,
#           VOICE_WEBHOOK_SECRET, N8N_WEBHOOK_SECRET, N8N_BASIC_AUTH_PASSWORD, OPENAI_API_KEY (or compatible)
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-receptionist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-receptionist} -d ${POSTGRES_DB:-app_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  app:
    build: .
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &app-environment
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:?APP_URL is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      IDENTITY_ENCRYPTION_KEY: ${IDENTITY_ENCRYPTION_KEY:?IDENTITY_ENCRYPTION_KEY is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      VOICE_WEBHOOK_SECRET: ${VOICE_WEBHOOK_SECRET:?VOICE_WEBHOOK_SECRET is required}
      VOICE_WEBHOOK_PREVIOUS_SECRET: ${VOICE_WEBHOOK_PREVIOUS_SECRET:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?N8N_WEBHOOK_SECRET is required}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      COMPATIBLE_LLM_BASE_URL: ${COMPATIBLE_LLM_BASE_URL:-}
      COMPATIBLE_LLM_API_KEY: ${COMPATIBLE_LLM_API_KEY:-}
      COMPATIBLE_LLM_MODEL: ${COMPATIBLE_LLM_MODEL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      VOICE_MEDIA_PUBLIC_URL: ${VOICE_MEDIA_PUBLIC_URL:?VOICE_MEDIA_PUBLIC_URL is required}
      VOICE_MEDIA_TOKEN: ${VOICE_MEDIA_TOKEN:?VOICE_MEDIA_TOKEN is required}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-generic}
      VOICE_API_BASE_URL: ${VOICE_API_BASE_URL:-}
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      STT_PROVIDER: ${STT_PROVIDER:-openai}
      STT_MODEL: ${STT_MODEL:-whisper-1}
      TTS_PROVIDER: ${TTS_PROVIDER:-openai}
      TTS_MODEL: ${TTS_MODEL:-tts-1}
      TTS_VOICE: ${TTS_VOICE:-alloy}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-ai-receptionist}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@example.com}
      NOTIFICATION_DEFAULT_CHANNEL: ${NOTIFICATION_DEFAULT_CHANNEL:-email}
      N8N_ENABLED: ${N8N_ENABLED:-true}
      N8N_URL: http://n8n:5678
      N8N_API_KEY: ${N8N_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      # All client traffic arrives via nginx (app port is not published), so
      # trusting X-Forwarded-For for rate limiting is safe AND required:
      # without it every client shares the nginx peer IP in one bucket.
      TRUST_PROXY: "true"
    volumes:
      - appstorage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - backend
      - frontend

  worker:
    build: .
    restart: always
    command: ["node", "--import", "tsx", "scripts/worker.ts"]
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 90s
    healthcheck:
      disable: true
    networks:
      - backend

  n8n:
    image: n8nio/n8n:1.x
    restart: always
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD is required}
      N8N_HOST: ${N8N_HOST:-n8n}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?N8N_WEBHOOK_SECRET is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OPS_CHAT_ID: ${TELEGRAM_OPS_CHAT_ID:-}
      TELEGRAM_SALES_CHAT_ID: ${TELEGRAM_SALES_CHAT_ID:-}
      TELEGRAM_URGENT_CHAT_ID: ${TELEGRAM_URGENT_CHAT_ID:-}
      GENERIC_TIMEZONE: ${TZ:-Asia/Tehran}
    volumes:
      - n8ndata:/home/node/.n8n
    networks:
      - backend

  media:
    # Voice media sidecar: WebSocket server for bidirectional telephony audio.
    # Gateways connect via VOICE_MEDIA_PUBLIC_URL (nginx /media → media:3001).
    build: .
    restart: always
    command: ["npx", "tsx", "scripts/media-server.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: "false"
      APP_URL: ${APP_URL:?APP_URL is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      # The sidecar validates the same env schema as the app at boot
      # (fail-fast in production), so it receives the same secrets/providers.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      VOICE_WEBHOOK_SECRET: ${VOICE_WEBHOOK_SECRET:?VOICE_WEBHOOK_SECRET is required}
      VOICE_WEBHOOK_PREVIOUS_SECRET: ${VOICE_WEBHOOK_PREVIOUS_SECRET:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?N8N_WEBHOOK_SECRET is required}
      VOICE_MEDIA_TOKEN: ${VOICE_MEDIA_TOKEN:?VOICE_MEDIA_TOKEN is required}
      VOICE_MEDIA_PORT: 3001
      VOICE_MEDIA_CODEC: ${VOICE_MEDIA_CODEC:-mulaw}
      VOICE_MEDIA_SAMPLE_RATE: ${VOICE_MEDIA_SAMPLE_RATE:-8000}
      VOICE_MEDIA_MAX_FRAME_BYTES: ${VOICE_MEDIA_MAX_FRAME_BYTES:-65536}
      VOICE_MEDIA_MAX_BUFFER_BYTES: ${VOICE_MEDIA_MAX_BUFFER_BYTES:-2097152}
      VOICE_MEDIA_IDLE_TIMEOUT_MS: ${VOICE_MEDIA_IDLE_TIMEOUT_MS:-600000}
      VOICE_MAX_CONCURRENT_SESSIONS: ${VOICE_MAX_CONCURRENT_SESSIONS:-100}
      VOICE_VAD_ENABLED: ${VOICE_VAD_ENABLED:-true}
      VOICE_VAD_SPEECH_THRESHOLD: ${VOICE_VAD_SPEECH_THRESHOLD:-0.015}
      VOICE_VAD_SILENCE_MS: ${VOICE_VAD_SILENCE_MS:-700}
      VOICE_VAD_MIN_SPEECH_MS: ${VOICE_VAD_MIN_SPEECH_MS:-180}
      VOICE_VAD_MAX_UTTERANCE_MS: ${VOICE_VAD_MAX_UTTERANCE_MS:-12000}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      COMPATIBLE_LLM_BASE_URL: ${COMPATIBLE_LLM_BASE_URL:-}
      COMPATIBLE_LLM_API_KEY: ${COMPATIBLE_LLM_API_KEY:-}
      COMPATIBLE_LLM_MODEL: ${COMPATIBLE_LLM_MODEL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-generic}
      VOICE_API_BASE_URL: ${VOICE_API_BASE_URL:-}
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      STT_PROVIDER: ${STT_PROVIDER:-openai}
      STT_MODEL: ${STT_MODEL:-whisper-1}
      TTS_PROVIDER: ${TTS_PROVIDER:-openai}
      TTS_MODEL: ${TTS_MODEL:-tts-1}
      TTS_VOICE: ${TTS_VOICE:-alloy}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-ai-receptionist}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - backend
      - frontend

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend

volumes:
  pgdata:
  redisdata:
  appstorage:
  n8ndata:

networks:
  backend:
  frontend:
